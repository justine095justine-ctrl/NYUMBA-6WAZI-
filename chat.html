;<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nyumba 6Wazi Chat</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f172a;color:white}.container{max-width:600px;margin:0 auto;height:100vh;display:flex;flex-direction:column}.header{background:#1e293b;padding:15px;text-align:center;border-bottom:2px solid #3b82f6}.auth-box,.chat-box{flex:1;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}input{background:#1e293b;color:white}button{background:#3b82f6;color:white;font-weight:bold;cursor:pointer}.messages{flex:1;overflow-y:auto;padding:10px;background:#1e293b;border-radius:8px;margin:10px 0}.message{background:#334155;padding:10px;margin:5px 0;border-radius:8px}.name{color:#3b82f6;font-weight:bold;font-size:12px}.send-box{display:flex;gap:10px}.send-box input{flex:1}.send-box button{width:100px}.hidden{display:none}</style></head><body><div class="container"><div class="header"><h2>🏠 Nyumba 6Wazi Chat</h2></div><div id="authBox" class="auth-box"><h3>Ingia au Jisajili</h3><input type="text" id="username" placeholder="Weka Jina lako"><input type="password" id="password" placeholder="Weka Password"><button onclick="register()">Jisajili</button><button onclick="login()">Ingia</button><p id="authError" style="color:red"></p></div><div id="chatBox" class="chat-box hidden"><button onclick="logout()" style="background:red;width:auto;float:right">Toka</button><h3>Karibu <span id="displayName"></span></h3><div id="messages" class="messages"></div><div class="send-box"><input type="text" id="messageInput" placeholder="Andika ujumbe..."><button onclick="sendMessage()">Tuma</button></div></div></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi",storageBucket:"nyumba-6wazi.firebasestorage.app",messagingSenderId:"401684834308",appId:"1:401684834308:web:a65ab41..."};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();
function register(){const u=document.getElementById('username').value;const p=document.getElementById('password').value;if(u.length<3){document.getElementById('authError').innerText="Jina liwe na herufi 3+";return}const e=u+"@nyumba6wazi.app";auth.createUserWithEmailAndPassword(e,p).then(()=>{db.ref('users/'+auth.currentUser.uid).set({name:u})}).catch(err=>document.getElementById('authError').innerText=err.message)}
function login(){const u=document.getElementById('username').value;const p=document.getElementById('password').value;const e=u+"@nyumba6wazi.app";auth.signInWithEmailAndPassword(e,p).catch(err=>document.getElementById('authError').innerText="Jina au Password si sahihi")}
function logout(){auth.signOut()}
function sendMessage(){const m=document.getElementById('messageInput').value;const u=auth.currentUser;if(m&&u){db.ref('users/'+u.uid).once('value').then(s=>{db.ref('messages').push({name:s.val().name,text:m,time:Date.now()})});document.getElementById('messageInput').value=''}}
db.ref('messages').on('child_added',s=>{const m=s.val();const d=document.createElement('div');d.className='message';d.innerHTML=`<div class="name">${m.name}</div><div>${m.text}</div>`;document.getElementById('messages').appendChild(d);document.getElementById('messages').scrollTop=99999});
auth.onAuthStateChanged(u=>{if(u){document.getElementById('authBox').classList.add('hidden');document.getElementById('chatBox').classList.remove('hidden');db.ref('users/'+u.uid).once('value').then(s=>{document.getElementById('displayName').innerText=s.val().name})}else{document.getElementById('authBox').classList.remove('hidden');document.getElementById('chatBox').classList.add('hidden')}})
</script></body></html>
