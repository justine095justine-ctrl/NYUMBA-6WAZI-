<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyumba 6Wazi - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: #0f172a; color: white; }
        .container { max-width: 600px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #3b82f6; }
        .auth-box, .chat-box { flex: 1; padding: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; }
        input { background: #1e293b; color: white; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; background: #1e293b; border-radius: 8px; margin: 10px 0; }
        .message { background: #334155; padding: 10px; margin: 5px 0; border-radius: 8px; }
        .message .name { color: #3b82f6; font-weight: bold; font-size: 12px; }
        .send-box { display: flex; gap: 10px; }
        .send-box input { flex: 1; }
        .send-box button { width: 100px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🏠 Nyumba 6Wazi Chat</h2>
        </div>

        <!-- SEHEMU YA LOGIN/REGISTER -->
        <div id="authBox" class="auth-box">
            <h3>Ingia au Jisajili</h3>
            <input type="email" id="email" placeholder="Email yako">
            <input type="password" id="password" placeholder="Password">
            <button onclick="register()">Jisajili</button>
            <button onclick="login()">Ingia</button>
            <p id="authError" style="color:red;"></p>
        </div>

        <!-- SEHEMU YA CHAT -->
        <div id="chatBox" class="chat-box hidden">
            <button onclick="logout()" style="background:red; width:auto; float:right;">Toka</button>
            <div id="messages" class="messages"></div>
            <div class="send-box">
                <input type="text" id="messageInput" placeholder="Andika ujumbe...">
                <button onclick="sendMessage()">Tuma</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. WEKA CONFIG YAKO YA FIREBASE HAPA
        const firebaseConfig = {
            apiKey: "WEKA_API_KEY_YAKO_HAPA",
            authDomain: "nyumba-6wazi.firebaseapp.com",
            databaseURL: "https://nyumba-6wazi-default-rtdb.firebaseio.com",
            projectId: "nyumba-6wazi",
            storageBucket: "nyumba-6wazi.appspot.com",
            messagingSenderId: "WEKA_ID_YAKO_HAPA",
            appId: "WEKA_APP_ID_YAKO_HAPA"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 2. KAZI ZA LOGIN/REGISTER
        function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, password)
                .catch(error => document.getElementById('authError').innerText = error.message);
        }

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password)
                .catch(error => document.getElementById('authError').innerText = error.message);
        }

        function logout() {
            auth.signOut();
        }

        // 3. KAZI ZA CHAT
        function sendMessage() {
            const msg = document.getElementById('messageInput').value;
            const user = auth.currentUser;
            if(msg && user) {
                db.ref('messages').push({
                    name: user.email,
                    text: msg,
                    time: Date.now()
                });
                document.getElementById('messageInput').value = '';
            }
        }

        // 4. ONA UJUMBE REAL-TIME
        db.ref('messages').on('child_added', snapshot => {
            const msg = snapshot.val();
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<div class="name">${msg.name}</div><div>${msg.text}</div>`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });

        // 5. ANGALIA KAMA MTU AMEINGIA
        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('chatBox').classList.remove('hidden');
            } else {
                document.getElementById('authBox').classList.remove('hidden');
                document.getElementById('chatBox').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
