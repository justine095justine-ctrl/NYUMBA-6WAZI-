<!DOCTYPE html>
<html>
<head>
<title>Nyumba 6Wazi Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
h2{text-align:center;color:#00ff88;padding:15px;background:#1a1a1a}
#msg{flex:1;overflow-y:scroll;background:#1a1a1a;padding:15px;margin:10px;border-radius:10px}
#msg div{margin:10px 0}
#msg b{color:#00ff88}
.input-area{display:flex;gap:8px;padding:10px;background:#1a1a1a}
input[type="text"]{flex:1;padding:12px;border-radius:25px;border:none;background:#333;color:#fff;font-size:16px}
button{padding:12px 16px;border-radius:25px;border:none;background:#00ff88;color:#000;font-weight:bold;font-size:16px}
#picBtn{background:#333;color:#00ff88;font-size:20px;padding:12px}
img{max-width:100%;border-radius:15px;margin:5px 0}
</style>
</head>
<body>
<h2>Nyumba 6Wazi Chat</h2>
<div id="msg"></div>
<input type="file" id="imageInput" accept="image/*" style="display:none">
<div class="input-area">
  <button id="picBtn">📎</button>
  <input type="text" id="msgInput" placeholder="Andika ujumbe...">
  <button id="sendBtn">Tuma</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",
  authDomain: "nyumba-6wazi.firebaseapp.com",
  databaseURL: "https://nyumba-6wazi-default-rtdb.firebaseio.com",
  projectId: "nyumba-6wazi",
  storageBucket: "nyumba-6wazi.firebasestorage.app",
  messagingSenderId: "401684834308",
  appId: "1:401684834308:web:a65ab41ee55de814ca2d51"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

const msgDiv = document.getElementById('msg');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const picBtn = document.getElementById('picBtn');
const imageInput = document.getElementById('imageInput');

picBtn.onclick = () => imageInput.click();

sendBtn.onclick = () => {
  const text = msgInput.value.trim();
  if(text) {
    db.ref('messages').push({name: 'Wewe', text: text, time: Date.now()});
    msgInput.value = '';
  }
};

imageInput.onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const ref = storage.ref('pics/' + Date.now() + file.name);
  ref.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
    db.ref('messages').push({name: 'Wewe', img: url, time: Date.now()});
  });
};

db.ref('messages').on('child_added', snap => {
  const m = snap.val();
  let content = m.text? m.text : `<img src="${m.img}">`;
  msgDiv.innerHTML += `<div><b>${m.name}:</b> ${content}</div>`;
  msgDiv.scrollTop = msgDiv.scrollHeight;
});
</script>
</body>
</html>
