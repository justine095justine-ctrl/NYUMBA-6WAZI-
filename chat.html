

<!DOCTYPE html>
<html>
<head><title>Nyumba 6Wazi Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#111;color:#fff;padding:10px}
h2{text-align:center;color:#00ff88;padding:10px 0}
#msg{height:70vh;overflow-y:scroll;background:#1a1a1a;border-radius:10px;padding:10px;margin-bottom:10px}
#msg div{margin:8px 0}
#msg b{color:#00ff88}
.input-area{display:flex;gap:5px}
input[type="text"]{flex:1;padding:12px;border-radius:25px;border:none;background:#333;color:#fff;font-size:16px}
button{padding:12px 16px;border-radius:25px;border:none;background:#00ff88;color:#000;font-weight:bold;font-size:16px}
#picBtn{background:#333;color:#00ff88;font-size:20px;padding:12px}
img{max-width:100%;border-radius:15px;margin:5px 0}
</style>
</head>
<body>
<h2>Nyumba 6Wazi Chat</h2>
<div id="msg"></div>
<input type="file" id="imageInput" accept="image/*" style="display:none">
<div class="input-area">
  <button id="picBtn">📎</button>
  <input type="text" id="msgInput" placeholder="Andika ujumbe...">
  <button id="sendBtn">Tuma</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = { /const firebaseConfig = {
  apiKey: "AIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",
  authDomain: "nyumba-6wazi.firebaseapp.com",
  databaseURL: "https://nyumba-6wazi-default-rtdb.firebaseio.com",
  projectId: "nyumba-6wazi",
  storageBucket: "nyumba-6wazi.firebasestorage.app",
  messagingSenderId: "401684834308",
  appId: "1:401684834308:web:a65ab41ee55de814ca2d51"
}; };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, 'messages');
const currentUser = localStorage.getItem("name");

const msgDiv = document.getElementById('msg');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const picBtn = document.getElementById('picBtn');
const imageInput = document.getElementById('imageInput');

// Tuma Ujumbe
sendBtn.onclick = () => {
  if(msgInput.value){
    push(messagesRef, {name: currentUser, text: msgInput.value, type: 'text', time: Date.now()});
    msgInput.value = '';
  }
}

// Tuma Picha
picBtn.onclick = () => imageInput.click();
imageInput.onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    push(messagesRef, {name: currentUser, text: reader.result, type: 'image', time: Date.now()});
  }
  reader.readAsDataURL(file);
}

// Pokea Ujumbe
onChildAdded(messagesRef, (snap) => {
  const data = snap.val();
  if(data.type === 'image'){
    msgDiv.innerHTML += `<b>${data.name}:</b><br><img src="${data.text}"><br>`;
  } else {
    msgDiv.innerHTML += `<b>${data.name}:</b> ${data.text}<br>`;
  }
  msgDiv.scrollTop = msgDiv.scrollHeight;
});
</script>
</body>
</html>
