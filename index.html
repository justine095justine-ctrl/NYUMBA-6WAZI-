<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYUMBA 6WAZI</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px;text-align:center}
#chat{height:70vh;overflow-y:auto;border:1px solid #333;padding:10px;background:#111;text-align:left}
.msg{padding:8px;border-radius:10px;margin:5px;max-width:75%}
.myMsg{background:#25D366;color:#000;margin-left:auto}
.otherMsg{background:#333;margin-right:auto}
input,button{padding:10px;border:0;border-radius:5px;margin-top:5px}
input{background:#222;color:#fff;width:70%}
button{background:#0f0;color:#000;width:28%;font-weight:bold}
</style>
</head>
<body>
<h2 style="color:#0f0">NYUMBA 6WAZI CHAT</h2>
<div id="chat">Inapakia...</div>
<input id="name" placeholder="Jina">
<input id="msg" placeholder="Ujumbe">
<button onclick="send()">TUMA</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const cfg={apiKey:"AIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi",storageBucket:"nyumba-6wazi.firebasestorage.app",messagingSenderId:"401684834308",appId:"1:401684834308:web:a65ab41ee55de814ca2d51"};
const app=initializeApp(cfg);const db=getDatabase(app);const chat=ref(db,"chat");const chatDiv=document.getElementById("chat");let me="";
onChildAdded(chat,(s)=>{const d=s.val();const di=document.createElement("div");di.className="msg "+(d.name===me?"myMsg":"otherMsg");di.innerHTML=`<b>${d.name}:</b> ${d.msg}`;chatDiv.appendChild(di);chatDiv.scrollTop=chatDiv.scrollHeight;if(chatDiv.innerText.includes("Inapakia"))chatDiv.innerHTML="";});
window.send=()=>{const n=document.getElementById("name").value;const m=document.getElementById("msg").value;if(n&&m){me=n;push(chat,{name:n,msg:m});document.getElementById("msg").value="";}}
</script>
</body>
</html>
