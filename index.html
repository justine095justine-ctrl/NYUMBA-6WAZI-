<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",
    authDomain: "nyumba-6wazi.firebaseapp.com",
    databaseURL: "https://nyumba-6wazi-default-rtdb.firebaseio.com",
    projectId: "nyumba-6wazi",
    storageBucket: "nyumba-6wazi.firebasestorage.app",
    messagingSenderId: "401684834308",
    appId: "1:401684834308:web:a65ab41ee55de814ca2d51"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const chatRef = ref(db, "chat");
  const chatDiv = document.getElementById("chat");
  let myName = "";

  onChildAdded(chatRef, (snap) => {
    const data = snap.val();
    const div = document.createElement("div");
    div.className = "msg " + (data.name === myName ? "myMsg" : "otherMsg");
    div.innerHTML = `<span class="sender">${data.name}</span>${data.msg}`;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    if(chatDiv.innerText.includes("Inapakia")) chatDiv.innerHTML = "";
  });
  window.send = () => {
    const name = document.getElementById("name").value.trim();
    const msg = document.getElementById("msg").value.trim();
    if(name && msg){
      myName = name;
      push(chatRef, {name, msg});
      document.getElementById("msg").value = "";
    }
  }
</script>
</body>
</html>
