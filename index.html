<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYUMBA 6WAZI</title><style>
body{background:#000;color:#0f0;font-family:Arial;padding:10px}
h1{text-align:center}#chatBox{height:60vh;border:2px solid #0f0;border-radius:10px;

<h1>🔥 NYUMBA 6WAZI 🔥</h1><div id="chatBox">Inapakia...</div>
<input id="name" value="Jastin"><input id="msg"><button onclick="send()">TUMA</button>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,push,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const c={apiKey:"-YAIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",
databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi"};

function send(){const n=name.value,t=msg.value;if(t)push(r,{name:n,text:t,time:new Date().toLocaleTimeString('sw-TZ',{h:'2-digit',m:'2-digit'})});msg.value=""}
onValue(r,s=>{chatBox.innerHTML="";const n=name.value;s.forEach(x=>{const d=x.val();
