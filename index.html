<!DOCTYPE html>
<html>
<head>
<title>6Wazi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}
h1{text-align:center;color:#0f0;padding:15px;background:#111;font-size:20px}
#box{flex:1;overflow-y:auto;padding:10px;background:#1a1a1a;margin:10px;border-radius:10px}
.msg{margin:5px 0}
.in{display:flex;padding:10px;background:#111;gap:5px}
input{flex:1;padding:12px;border:0;border-radius:20px;background:#333;color:#fff;font-size:16px}
button{padding:12px 20px;border:0;border-radius:20px;background:#0f0;color:#000;font-weight:bold}
</style>
</head>
<body>
<h1>Nyumba 6Wazi Chat</h1>
<div id="box"></div>
<div class="in">
<input id="n" placeholder="Jina lako">
<input id="t" placeholder="Andika...">
<button onclick="send()">Tuma</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
<script>
// WEKA CONFIG YAKO HAPA
const firebaseConfig = {
  apiKey: "AIzaSyANpw55jBWxMyf6AC1_y7m6idNYhLPyka0",
  authDomain: "nyumba-6wazi.firebaseapp.com",
  databaseURL: "https://nyumba-6wazi-default-rtdb.firebaseio.com",
  projectId: "nyumba-6wazi",
  storageBucket: "nyumba-6wazi.firebasestorage.app",
  messagingSenderId: "401684834308",
  appId: "1:401684834308:web:a65ab41ee55de814ca2d51"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

function send(){
  if(n.value!="" && t.value!=""){
    db.ref("chat").push({jina:n.value,ujumbe:t.value});
    t.value="";
  }
}

db.ref("chat").on("child_added",function(data){
  var d = data.val();
  box.innerHTML += '<div class="msg"><b style="color:#0f0">'+d.jina+':</b> '+d.ujumbe+'</div>';
  box.scrollTop = box.scrollHeight;
});
</script>
</body>
</html>
