<!DOCTYPE html>
<html>
<head>
<title>NYUMBA 6WAZI CHAT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0b141a;color:#fff;font-family:Arial;margin:0}
#home{display:block}
#chatScreen{display:none}
#top{text-align:center;padding:10px;background:#1f2c33;position:sticky;top:0}
#top h1{color:#00ff00;margin:0;font-size:16px}
.back{float:left;color:#00a884;cursor:pointer}
#groupList{padding:10px}
.group{padding:15px;background:#202c33;margin-bottom:8px;border-radius:8px;cursor:pointer}
.group b{display:block}
.group small{color:#8696a0}
#chat{padding:10px;height:calc(100vh - 140px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:8px;max-width:70%;word-wrap:break-word}
.me{background:#005c4b;margin-left:auto;border-bottom-right-radius:2px}
.you{background:#202c33;margin-right:auto;border-bottom-left-radius:2px}
b.name{display:block;font-size:11px;margin-bottom:3px}
.time{font-size:10px;color:#8696a0;text-align:right;margin-top:4px}
#tuma{position:fixed;bottom:0;left:0;width:100%;display:flex;padding:8px;background:#1f2c33;gap:5px}
#m{flex:1;padding:12px;border:none;background:#2a3942;color:#fff;outline:none;border-radius:20px}
.btn{width:45px;height:45px;background:#00a884;color:#fff;border:none;border-radius:50%;font-size:18px}
img.chat-img{max-width:200px;border-radius:8px;margin-top:5px}
</style>
</head>
<body>

<!-- PAGE 1: ORODHA YA MAGROUP -->
<div id="home">
<div id="top"><h1>NYUMBA 6WAZI CHAT</h1></div>
<div id="groupList">
  <div class="group" onclick="funguaGroup('nyumba6wazi')">
    <b>NYUMBA 6WAZI</b>
    <small>Group Kuu ya Marafiki</small>
  </div>
  <div class="group" onclick="funguaGroup('wakuru')">
    <b>WAKURU GEN</b>
    <small>Watu wa mtaani</small>
  </div>
  <div class="group" onclick="funguaGroup('family')">
    <b>FAMILY</b>
    <small>Nyumbani</small>
  </div>
  <div class="group" onclick="tengenezaGroup()">
    <b>+ Tengeneza Group Mpya</b>
  </div>
</div>
</div>

<!-- PAGE 2: NDANI YA CHAT -->
<div id="chatScreen">
<div id="top">
  <span class="back" onclick="rudiHome()">←</span>
  <h1 id="jinaGroup">Group</h1>
</div>
<div id="chat"></div>
<div id="tuma">
<input type="file" id="file" style="display:none" accept="image/*" onchange="tumaPicha(event)">
<button class="btn" onclick="document.getElementById('file').click()">📎</button>
<input id="m" placeholder="Andika ujumbe" onkeypress="if(event.key=='Enter')tuma()">
<button class="btn" onclick="tuma()">➤</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
var cfg={apiKey:"AIzaSyANpw55jBwxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi",storageBucket:"nyumba-6wazi.appspot.com",messagingSenderId:"401684834308",appId:"1:401684834308:web:a65ab41ee55de814ca2d51"};
firebase.initializeApp(cfg);
var db=firebase.database();

var jina = localStorage.getItem("nyumba6wazi_jina");
if(!jina){
  jina = prompt("Weka jina lako:");
  if(!jina || jina.trim()=="") jina = "Mgeni" + Math.floor(Math.random()*1000);
  localStorage.setItem("nyumba6wazi_jina", jina);
}

var groupIdSasa = "";
var chatRef;

function funguaGroup(id){
  groupIdSasa = id;
  document.getElementById("home").style.display="none";
  document.getElementById("chatScreen").style.display="block";
  document.getElementById("jinaGroup").innerText = id.toUpperCase();
  loadChat();
}

function rudiHome(){
  document.getElementById("home").style.display="block";
  document.getElementById("chatScreen").style.display="none";
  if(chatRef) chatRef.off();
}

function tengenezaGroup(){
  var jipya = prompt("Andika jina la Group jipya:");
  if(jipya) funguaGroup(jipya.toLowerCase().replace(/ /g,""));
}

function loadChat(){
  chatRef = db.ref("groups/"+groupIdSasa+"/chat");
  document.getElementById("chat").innerHTML="";
  chatRef.limitToLast(50).on("child_added",function(s){
    var d = s.val(); if(!d) return;
    var x = document.createElement("div");
    var niMimi = d.jina == jina;
    x.className = "msg " + (niMimi? "me" : "you");
    var saa = new Date(d.time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    var content = d.picha? "<img class='chat-img' src='"+d.picha+"'>" : d.ujumbe;
    x.innerHTML = "<b class='name'>" + d.jina + "</b>" + content + "<div class='time'>" + saa + "</div>";
    document.getElementById("chat").appendChild(x);
    document.getElementById("chat").scrollTop = 99999;
  });
}

function tumaPicha(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    chatRef.push({jina:jina, picha:ev.target.result, time:Date.now()});
  }
  reader.readAsDataURL(file);
}

function tuma(){
  var msg = document.getElementById("m").value;
  if(!msg) return;
  chatRef.push({jina:jina, ujumbe:msg, time:Date.now()});
  document.getElementById("m").value = "";
}
</script>
</body>
</html>
