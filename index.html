<!DOCTYPE html>
<html>
<head>
<title>NYUMBA 6WAZI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{background:#000;color:#fff;font-family:Arial;margin:0}#reg{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;justify-content:center;align-items:center}#reg div{background:#222;padding:20px;border-radius:10px;width:300px;text-align:center}input{width:90%;padding:10px;margin:10px 0;border-radius:5px;border:none}button{width:100%;padding:12px;background:#0084ff;color:#fff;border:none;border-radius:5px;font-weight:bold}#chat{padding:10px;height:80vh;overflow-y:auto;margin-bottom:50px}.msg{margin:10px;padding:8px;border-radius:8px;max-width:70%}.me{background:#0084ff;margin-left:auto}.you{background:#333}b{display:block;font-size:12px}#tuma{position:fixed;bottom:0;width:100%;display:flex;background:#222}#m{flex:1;padding:10px;border:none;background:#333;color:#fff}</style>
</head>
<body>
<div id="reg"><div><h2>Karibu NYUMBA 6WAZI</h2><input id="jina" placeholder="Andika Jina Lako"><input id="namba" placeholder="Andika Namba ya Simu" type="tel"><button onclick="ingia()">INGIA CHAT</button></div></div>
<div id="chat"></div>
<div id="tuma"><input id="m" placeholder="Andika ujumbe..." onkeypress="if(event.key=='Enter')tuma()"><button onclick="tuma()">Tuma</button></div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
var cfg={apiKey:"AIzaSyANpw55jBwxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi",storageBucket:"nyumba-6wazi.appspot.com",messagingSenderId:"401684834308",appId:"1:401684834308:web:a65ab41ee55de814ca2d51"};
firebase.initializeApp(cfg);var db=firebase.database(),chat=db.ref("chat");var jina=localStorage.jina,namba=localStorage.namba;
if(jina&&namba)document.getElementById("reg").style.display="none";
chat.limitToLast(50).on("child_added",function(s){var d=s.val();var x=document.createElement("div");x.className="msg "+(d.jina==jina?"me":"you");x.innerHTML="<b>"+d.jina+"</b>"+d.ujumbe;document.getElementById("chat").appendChild(x);document.getElementById("chat").scrollTop=99999});
function ingia(){jina=document.getElementById("jina").value;namba=document.getElementById("namba").value;if(!jina||!namba)return alert("Jaza zote");localStorage.jina=jina;localStorage.namba=namba;document.getElementById("reg").style.display="none"}
function tuma(){var msg=document.getElementById("m").value;if(!msg||!jina)return alert("Jisajili kwanza");chat.push({jina:jina,ujumbe:msg});document.getElementById("m").value=""}
</script>
</body>
</html>
