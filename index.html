<!DOCTYPE html>
<html>
<head>
<title>NYUMBA 6WAZI CHAT</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
  body { background: #0e0e0e; color: white; font-family: Arial; margin:0; padding-bottom:60px; }
  #chat { padding: 10px; height: 80vh; overflow-y: scroll; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 12px; border-radius: 18px; max-width: 70%; word-wrap: break-word; font-size: 15px; }
  .me { background: #0084ff; align-self: flex-end; } /* Wako - bluu kulia */
  .you { background: #3a3a3a; align-self: flex-start; } /* Wa wengine - kijivu kushoto */
  .msg b { font-size: 12px; display: block; margin-bottom: 3px; color: #ddd; }
  .inputs { position:fixed; bottom:0; width:100%; display:flex; padding:8px; gap:5px; background:#111; }
  #n, #m { flex:1; padding: 10px; border: none; border-radius: 10px; background: #222; color: white; }
  button { padding: 10px 20px; border: none; border-radius: 10px; background: #00ff88; font-weight: bold; color:black; }
</style>
</head>
<body>

<div id="reg" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;display:flex;align-items:center;justify-content:center;z-index:999">
  <div style="background:#1e1e1e;padding:20px;border-radius:10px;width:90%;max-width:350px">
    <h3 style="color:#fff;text-align:center">Karibu NYUMBA 6WAZI</h3>
    <input id="n" placeholder="Andika Jina Lako" style="width:100%;padding:10px;margin:10px 0;border-radius:5px;border:none">
    <input id="p" placeholder="Andika Namba ya Simu" type="tel" style="width:100%;padding:10px;margin:10px 0;border-radius:5px;border:none">
    <button onclick="ingia()" style="width:100%;padding:10px;background:#0084ff;color:#fff;border:none;border-radius:5px">INGIA CHAT</button>
  </div>
      </div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
var cfg={apiKey:"AIzaSyANpw55jBwxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi",storageBucket:"nyumba-6wazi.appspot.com",messagingSenderId:"401684834308",appId:"1:401684834308:web:a65ab41ee55de814ca2d51"};
firebase.initializeApp(cfg);var db=firebase.database(),chat=db.ref("chat"),users=db.ref("users");

var jina=localStorage.jina||"",namba=localStorage.namba||"";

window.onload=function(){
  if(jina&&namba){document.getElementById("reg").style.display="none"}
  loadChat();
}

function ingia(){
  jina=document.getElementById("jina").value;
  namba=document.getElementById("namba").value;
  if(!jina||!namba)return alert("Jaza jina na namba");
  localStorage.jina=jina;localStorage.namba=namba;
  users.child(namba).set({jina:jina,namba:namba,t:Date.now()});
  document.getElementById("reg").style.display="none";
  loadChat();
}

function loadChat(){
  chat.limitToLast(50).on("child_added",function(s){
    var d=s.val();if(!d.jina||!d.ujumbe)return;
    var x=document.createElement("div");
    x.className="msg "+(d.jina==jina?"me":"you");
    x.innerHTML="<b>"+d.jina+"</b>"+d.ujumbe;
    document.getElementById("chat").appendChild(x);
    document.getElementById("chat").scrollTop=99999
  });
}

function tuma(){
  if(!jina||!namba)return alert("Tafadhali jisajili kwanza");
  var msg=document.getElementById("m").value;
  if(!msg)return;
  chat.push({jina:jina,ujumbe:msg,namba:namba,t:Date.now()});
  document.getElementById("m").value=""
}
    </script>
