<!DOCTYPE html>
<html>
<head>
<title>6WAZI CHAT TZ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0b141a;color:#fff;font-family:Arial;margin:0}
#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b141a;display:flex;justify-content:center;align-items:center}
.loginBox{background:#1f2c33;padding:30px;border-radius:10px;text-align:center;width:80%;max-width:320px}
.loginBox input{width:100%;padding:12px;margin:8px 0;background:#2a3942;border:none;color:#fff;border-radius:5px;box-sizing:border-box}
.loginBox button{width:100%;padding:12px;background:#7B2FFF;color:#fff;border:none;border-radius:5px;font-weight:bold}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <h2 style="color:#7B2FFF">6WAZI CHAT TZ</h2>
    <input id="loginJina" placeholder="Weka Jina Lako">
    <input id="loginPass" type="password" placeholder="Weka Neno la siri">
    <button onclick="login()">Ingia</button>
    <p style="font-size:10px;color:#8696a0">Sera: Tunahifadhi jina na meseji tu</p>
  </div>
</div>

<div id="home" style="display:none;padding:20px">
  <h1 style="color:#7B2FFF">Karibu 6WAZI CHAT TZ</h1>
  <p>Imeingia! Sasa tunaweka groups hapa</p>
</div>

<script>
// TEST BILA FIREBASE KWANZA
function login(){
  var jina = document.getElementById("loginJina").value.trim();
  var pass = document.getElementById("loginPass").value.trim();
  if(jina != "" && pass != ""){
    localStorage.setItem("nyumba6wazi_jina", jina);
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("home").style.display="block";
  }else{ 
    alert("Tafadhali jaza Jina na Neno la Siri"); 
  }
}

// Kama ulishaingia awali
window.onload = function(){
  if(localStorage.getItem("nyumba6wazi_jina")){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("home").style.display="block";
  }
}
</script>
</body>
</html>
