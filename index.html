<!DOCTYPE html>
<html>
<head>
<title>NYUMBA 6WAZI CHAT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding-bottom:60px}
#top{text-align:center;padding:12px;background:#111}
#top h1{color:#00ff00;margin:0;font-size:18px}
#chat{padding:10px;height:calc(100vh - 120px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:18px;max-width:70%;word-wrap:break-word;line-height:1.4}
.me{background:#00a884;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.you{background:#2a2f32;color:#fff;margin-right:auto;border-bottom-left-radius:4px}
b{display:block;font-size:11px;margin-bottom:3px;font-weight:bold}
.me b{color:#d1f7c4}
.you b{color:#00ff00}
#tuma{position:fixed;bottom:0;left:0;width:100%;display:flex;padding:8px;background:#111;gap:8px}
#m{flex:1;padding:12px;border:none;background:#2a2f32;color:#fff;outline:none;border-radius:20px}
#tuma button{width:70px;background:#00a884;color:#fff;border:none;border-radius:50%;font-weight:bold}
</style>
</head>
<body>

<div id="top">
  <h1>NYUMBA 6WAZI CHAT</h1>
</div>
<div id="chat"></div>

<div id="tuma">
<input id="m" placeholder="Andika ujumbe" onkeypress="if(event.key=='Enter')tuma()">
<button onclick="tuma()">TUMA</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
var cfg={apiKey:"AIzaSyANpw55jBwxMyf6AC1_y7m6idNYhLPyka0",authDomain:"nyumba-6wazi.firebaseapp.com",databaseURL:"https://nyumba-6wazi-default-rtdb.firebaseio.com",projectId:"nyumba-6wazi",storageBucket:"nyumba-6wazi.appspot.com",messagingSenderId:"401684834308",appId:"1:401684834308:web:a65ab41ee55de814ca2d51"};
firebase.initializeApp(cfg);
var db=firebase.database();
var chat=db.ref("chat");

// Hifadhi jina
var jina = localStorage.getItem("nyumba6wazi_jina");
if(!jina){
  jina = prompt("Weka jina lako la kuingia NYUMBA 6WAZI:");
  if(!jina || jina.trim()=="") jina = "Mgeni" + Math.floor(Math.random()*1000);
  localStorage.setItem("nyumba6wazi_jina", jina);
}

loadChat();

function loadChat(){
  chat.limitToLast(50).on("child_added",function(s){
    var d = s.val();
    if(!d || !d.jina || !d.ujumbe) return;
    var x = document.createElement("div");
    x.className = "msg " + (d.jina == jina ? "me" : "you");
    x.innerHTML = "<b>" + d.jina + "</b>" + d.ujumbe;
    document.getElementById("chat").appendChild(x);
    document.getElementById("chat").scrollTop = 99999;
  });
}

function tuma(){
  var msg = document.getElementById("m").value;
  if(!msg) return;
  chat.push({jina:jina, ujumbe:msg, time:Date.now()});
  document.getElementById("m").value = "";
}
</script>
</body>
</html>
